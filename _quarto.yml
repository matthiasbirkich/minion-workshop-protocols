format:
  html:
    toc: true
    toc-depth: 3
    theme: cosmo
    link-external-newwindow: true
    link-external-icon: true
    css: styles.css
    include-after-body:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", function () {

          const pageKey = window.location.pathname;

          function readSaved(key) {
            try { return localStorage.getItem(key); }
            catch (e) { return null; }
          }

          function saveValue(key, value) {
            try { localStorage.setItem(key, value); }
            catch (e) {}
          }

          document.querySelectorAll(
            '.task-list input[type="checkbox"]'
          ).forEach(function (box, index) {

            box.disabled = false;
            const key = 'sharkseq:' + pageKey + ':task:' + index;
            const saved = readSaved(key);

            if (saved !== null) {
              box.checked = saved === '1';
            }

            box.addEventListener('change', function () {
              saveValue(key, box.checked ? '1' : '0');
            });
          });

          document.querySelectorAll(
            '.protocol-notes'
          ).forEach(function (field, index) {

            const noteID = field.dataset.noteId || index;
            const key = 'sharkseq:' + pageKey + ':note:' + noteID;
            const saved = readSaved(key);

            if (saved !== null) {
              field.value = saved;
            }

            field.addEventListener('input', function () {
              saveValue(key, field.value);
            });
          });

          document.querySelectorAll(
            '.protocol-input, .protocol-select'
          ).forEach(function (field, index) {

            const fieldID = field.dataset.fieldId || index;
            const key = 'sharkseq:' + pageKey + ':field:' + fieldID;
            const saved = readSaved(key);

            if (saved !== null) {
              field.value = saved;
            }

            field.addEventListener('input', function () {
              saveValue(key, field.value);
            });

            field.addEventListener('change', function () {
              saveValue(key, field.value);
            });
          });

          document.querySelectorAll('[data-reset-protocol]').forEach(function (button) {
            button.addEventListener('click', function () {
              if (!confirm('Clear saved checkboxes, selections and notes for this page?')) return;
              try {
                Object.keys(localStorage).forEach(function (key) {
                  if (key.startsWith('sharkseq:' + pageKey + ':')) {
                    localStorage.removeItem(key);
                  }
                });
              } catch (e) {}
              window.location.reload();
            });
          });

        });
        </script>

resources:
  - Protocol.pdf
  - figures/**
  - tools/**
